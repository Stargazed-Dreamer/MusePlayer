name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    # 代码风格 / 类型检查只需在单平台跑一次
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装开发依赖
        run: |
          python -m pip install --upgrade pip
          pip install ruff>=0.5 mypy>=1.10

      - name: Ruff 检查
        run: ruff check .

      - name: Ruff 格式化检查
        run: ruff format --check .

      - name: Mypy 类型检查
        run: mypy app/ core/
        continue-on-error: true  # 渐进式：先不阻断 CI

  test:
    # 三平台 + 多 Python 版本矩阵，验证跨平台兼容性
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装 Linux 系统依赖（PortAudio）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: 运行测试
        run: pytest tests/ -v --tb=short
        env:
          QT_QPA_PLATFORM: ${{ runner.os == 'Linux' && 'offscreen' || '' }}

  smoke-test:
    # 冒烟测试：验证应用主模块在非 Windows 平台也能 import（不实际启动 GUI）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装 Linux 系统依赖（PortAudio）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 冒烟导入验证（不启动 GUI）
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import app.services.app_controller; import app.runtime.control_server; import core.core; print('import OK')"
